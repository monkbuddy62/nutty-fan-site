<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Campaign map</title>
<link rel="icon" href="data:,">
<style>
/* === CRITICAL === (everything the LQIP's first paint needs; the rest is viewer.css) */
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; }
/* The map's sea, behind the transparent canvas (the style has no background layer). Only on <html>: a body background
   would paint over it. #6faebd is meta.bg of the current map; EARLY sets the real one. */
html { background: #6faebd; }
#map { position: fixed; inset: 0; touch-action: none; }
/* Under the map (earlier in the document, no z-index): the canvas is transparent where no tile is drawn yet, so the
   tiles land on top of it, and viewer.js moves it with the camera until the backdrop replaces it. */
#lqip { position: fixed; left: 0; top: 0; pointer-events: none; transform-origin: 0 0; }
#build { position: fixed; z-index: 3; left: calc(4px + env(safe-area-inset-left)); bottom: calc(4px + env(safe-area-inset-bottom));
  padding: 2px 5px; font: 11px/1.3 monospace; color: #fff; background: rgba(0,0,0,.5); border-radius: 3px; pointer-events: none; }
#full { position: fixed; z-index: 3; right: calc(6px + env(safe-area-inset-right)); top: calc(6px + env(safe-area-inset-top));
  padding: 6px 10px; font: 13px/1.2 -apple-system, system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55);
  border-radius: 14px; text-decoration: none; }
</style>
<link rel="stylesheet" href="viewer.css?v=5" media="print" onload="this.media='all'">
<link rel="modulepreload" href="libs/maplibre-gl-6.12.0/maplibre-gl.mjs">
<link rel="modulepreload" href="libs/maplibre-gl-6.12.0/maplibre-gl-shared.mjs">
</head>
<body>
<img id="lqip" alt="" decoding="sync">
<div id="map"></div>
<a id="full" href="../dnd-map/?edit">Open full map</a>
<div id="build">map build 5</div>
<script src="meta.js?v=5"></script>
<script>
// === EARLY === page-zoom guards, the shared config, the LQIP at the exact rect of the initial view, and the
// first view's tiles started before MapLibre loads. The initial view is computed here once (hash, then the
// stored last view, then the default) and handed to viewer.js as window.DND_VIEW0 = {s, x, y}: s is CSS px
// per map unit, x/y the map point at the centre.
(function () {
  // The constants both scripts need live here only; viewer.js reads window.DND_CFG.
  var Q = new URLSearchParams(location.search);
  var CFG = window.DND_CFG = {
    MAX_S: 20,                        // deepest zoom, CSS px per map unit
    VIEW_KEY: "dndView.v1",           // localStorage: the last view {map, s, x, y}
    // How tiles reach the GPU (specs/dnd-view.md > Tile loading): "worker" (default) decodes the fetched bytes
    // into raw RGBA in a worker; "bitmap" makes an ImageBitmap on the main thread; "img" is MapLibre's <img> path.
    TILES: Q.has("imgpath") ? "img" : Q.has("bitmap") ? "bitmap" : "worker",
    // "#s/x/y" -> {s, x, y}, or null unless s > 0 and all three are finite numbers.
    parseHash: function (h) {
      var m = /^#(-?[\d.]+)\/(-?[\d.]+)\/(-?[\d.]+)$/.exec(h || "");
      var v = m && { s: +m[1], x: +m[2], y: +m[3] };
      return v && v.s > 0 && isFinite(v.s) && isFinite(v.x) && isFinite(v.y) ? v : null;
    },
    pre: {},                          // tile path -> Promise<ArrayBuffer> started below ("worker"/"bitmap")
  };
  var noZoom = function (e) { e.preventDefault(); };
  document.addEventListener("gesturestart", noZoom, { passive: false });
  document.addEventListener("gesturechange", noZoom, { passive: false });
  document.addEventListener("gestureend", noZoom, { passive: false });
  document.addEventListener("dblclick", noZoom, { passive: false });
  var M = window.DND_META;
  if (!M) return;
  document.documentElement.style.background = M.bg;
  var el = document.getElementById("map"), cw = el.clientWidth || innerWidth, ch = el.clientHeight || innerHeight;
  var contain = Math.min(cw / M.width, ch / M.height), cover = Math.max(cw / M.width, ch / M.height);
  var v = CFG.parseHash(location.hash);
  if (!v) try { var o = JSON.parse(localStorage.getItem(CFG.VIEW_KEY) || "null"); if (o && o.map === M.mapHash) v = o; } catch (e) {}
  if (!v || !(v.s > 0) || !isFinite(v.x) || !isFinite(v.y)) v = { s: Math.min(Math.max(1, contain), cover), x: M.width / 2, y: M.height / 2 };
  v = { s: Math.min(Math.max(v.s, contain), CFG.MAX_S), x: Math.min(Math.max(v.x, 0), M.width), y: Math.min(Math.max(v.y, 0), M.height) };
  window.DND_VIEW0 = v;
  var img = document.getElementById("lqip");
  img.onload = function () { if (performance.mark) performance.mark("dnd-lqip"); };
  img.style.width = M.width * v.s + "px";
  img.style.height = M.height * v.s + "px";
  img.style.transform = "translate(" + (cw / 2 - v.x * v.s) + "px," + (ch / 2 - v.y * v.s) + "px)";
  img.src = M.lqip;
  // The tiles MapLibre will ask for first (its covering rule: level round(log2(s * dpr))), fetched now so they
  // download alongside the 294 KB of MapLibre instead of after it. viewer.js's tile loader takes these promises;
  // the "img" path just warms the HTTP cache.
  var dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 3);
  var n = Math.min(Math.max(Math.round(Math.log2(v.s * dpr)), 0), M.maxLevel), span = M.tileSize / Math.pow(2, n);
  var tx = Math.ceil(M.width / span) - 1, ty = Math.ceil(M.height / span) - 1, r = M.rev ? "?r=" + M.rev : "";
  var x0 = Math.max(0, Math.floor((v.x - cw / 2 / v.s) / span)), x1 = Math.min(tx, Math.floor((v.x + cw / 2 / v.s) / span));
  var y0 = Math.max(0, Math.floor((v.y - ch / 2 / v.s) / span)), y1 = Math.min(ty, Math.floor((v.y + ch / 2 / v.s) / span));
  for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
    var rel = M.tiles.replace("{z}", n + M.zOffset).replace("{x}", x).replace("{y}", y) + r;
    if (CFG.TILES === "img") new Image().src = rel;
    else {
      // force-cache: the ?r= URL is immutable (viewer.js fetchImmutable); a failure is retried there from the network.
      var p = CFG.pre[rel] = fetch(rel, { cache: "force-cache" }).then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.arrayBuffer(); });
      p.catch(function () {});        // a failed preload is retried by the loader; never an unhandled rejection
    }
  }
})();
</script>
<script type="module">
import * as maplibregl from "./libs/maplibre-gl-6.12.0/maplibre-gl.mjs";
window.maplibregl = maplibregl;
</script>
<script src="viewer.js?v=5" defer></script>
</body>
</html>
